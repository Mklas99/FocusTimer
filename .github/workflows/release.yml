name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build installer and publish release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build both installers and portable EXE
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version "${{ github.ref_name }}"

      - name: Rename portable EXE for release
        shell: pwsh
        run: Copy-Item "artifacts/publish/win-x64-portable/FocusTimer.Host.exe" "artifacts/FocusTimer-${{ github.ref_name }}-win-x64.exe"

      # The framework-dependent MSI (artifacts/installer/FocusTimer.Installer.framework-dependent.msi)
      # is still built above because the Setup EXE below chains it as its install payload, but it is
      # not published as its own release asset: it only exists to serve a managed-deployment scenario
      # (.NET 8 already provisioned by other means) that this personal project doesn't have.
      #
      # NOTE: the Setup EXE's .NET 8 detection/download path is untested — no test environment without
      # .NET 8 preinstalled has been set up yet to exercise it. Verify manually before relying on it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/installer/FocusTimer.Installer.selfcontained.msi
            artifacts/installer/FocusTimer.Setup.framework-dependent.exe
            artifacts/FocusTimer-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true
