name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build installer and publish release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build self-contained EXE + MSI
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version "${{ github.ref_name }}"

      - name: Rename portable EXE for release
        shell: pwsh
        run: Copy-Item "artifacts/publish/win-x64-selfcontained/FocusTimer.Host.exe" "artifacts/FocusTimer-${{ github.ref_name }}-win-x64.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/installer/FocusTimer.Installer.msi
            artifacts/FocusTimer-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true
