name: SonarQube Cloud

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  sonar:
    name: Build, test, coverage, analyze
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore FocusTimer.sln

      - name: Begin Sonar analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"Mklas99_FocusTimer"
          /o:"mklas99"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/*.coverage.opencover.xml,**/TestResults/*.opencover.xml,**/coverage.opencover.xml"

      - name: Build
        run: dotnet build FocusTimer.sln -c Release --no-restore

      - name: Test with coverage (per-project)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TestResults
          $projects = Get-ChildItem -Path tests -Filter "*.csproj" -Recurse
          foreach ($proj in $projects) {
              $name = $proj.BaseName
              Write-Host "Running tests with coverage for $name"
              dotnet test $proj.FullName -c Release --no-build `
                /p:CollectCoverage=true `
                /p:CoverletOutputFormat=opencover `
                /p:CoverletOutput="./TestResults/$name.coverage.opencover.xml"
          }

      - name: End Sonar analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
