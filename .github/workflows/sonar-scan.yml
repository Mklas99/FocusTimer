name: SonarQube Cloud

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  sonar:
    name: Build, test, coverage, analyze
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore FocusTimer.sln

      - name: Begin Sonar analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"Mklas99_FocusTimer"
          /o:"mklas99"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="artifacts/test-coverage/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build FocusTimer.sln -c Release --no-restore

      # Enforces the line-coverage threshold (fails the job below it) and writes reports
      # to artifacts/test-coverage/<project>/.
      - name: Test with coverage (threshold enforced)
        shell: pwsh
        run: ./scripts/run-unit-coverage.ps1 -Configuration Release -NoBuild

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator `
            "-reports:artifacts/test-coverage/**/coverage.cobertura.xml" `
            "-targetdir:artifacts/coverage-report" `
            "-reporttypes:MarkdownSummaryGithub;HtmlInline" | Out-Null
          $summary = "artifacts/coverage-report/SummaryGithub.md"
          if (Test-Path $summary) {
              Get-Content $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
              "No coverage report was produced." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/
          if-no-files-found: warn

      - name: End Sonar analysis
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
